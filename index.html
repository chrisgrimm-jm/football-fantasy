<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat Snapshot — Talkin' Giants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =====================================================================================
     BRAND — this block is the single source of truth for the look, including the canvas
     PNG export (the JS reads these values back out of :root rather than hardcoding them).
     Change a hex here and the whole app + both graphics follow.
     ===================================================================================== */
  :root{
    --brand:#003981;          /* Talkin' Giants blue */
    --accent:#c9243f;         /* Giants red — top rule, active pills, buttons */
    --label:#8fbdf0;          /* small-caps stat labels; light blue reads far better on blue than red */

    /* the lower-third gradient sweep, derived from --brand */
    --lt-from:#002856;
    --lt-mid:#003981;
    --lt-to:#001b3b;

    --bg:#00152e;
    --surface:#012f60;
    --surface2:#08447e;
    --surface3:#001c3d;
    --border:rgba(255,255,255,0.1);
    --border2:rgba(255,255,255,0.2);
    --accent-dim:rgba(201,36,63,0.15);
    --accent-dim2:rgba(201,36,63,0.07);
    --red:#ff6b6b;
    --red-dim:rgba(255,107,107,0.15);
    --green:#5fddaa;
    --green-dim:rgba(95,221,170,0.12);
    --white:#ffffff;
    --text:#ffffff;
    --text2:rgba(255,255,255,0.55);
    --text3:rgba(255,255,255,0.30);
    --font-display:'Bebas Neue',sans-serif;
    --font-body:'DM Sans',sans-serif;
    --font-mono:'DM Mono',monospace;
    --radius:6px;
    --radius-lg:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased}

  /* ---- header ---- */
  header{padding:16px 22px 14px;border-bottom:1px solid var(--border);background:var(--surface3);
    position:sticky;top:0;z-index:40}
  .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;color:var(--label);
    text-transform:uppercase;margin:0 0 8px;opacity:.9}
  .titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1;margin:0;
    letter-spacing:.03em;color:var(--white)}
  h1 span{color:var(--accent)}
  .home-btn{background:none;color:var(--label);border:1px solid rgba(143,189,240,.35);border-radius:20px;
    padding:6px 15px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;cursor:pointer;flex:none;transition:all .15s}
  .home-btn:hover{background:var(--label);border-color:var(--label);color:var(--surface3)}
  .teambadge{display:flex;align-items:center;gap:9px}
  .teambadge img{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);padding:3px;
    object-fit:contain}
  .teambadge .tn{font-family:var(--font-display);font-size:17px;letter-spacing:.06em;
    color:var(--text2);line-height:1}
  .datanote{position:absolute;top:16px;right:22px;font-family:var(--font-mono);font-size:9px;
    letter-spacing:.14em;color:var(--text3);background:var(--accent-dim2);
    border:1px solid var(--border);border-radius:20px;padding:5px 12px;text-transform:uppercase}
  .datanote b{color:var(--label);font-weight:400}

  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:14px}
  label{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--label);margin-bottom:5px;opacity:.9}
  select,input{background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:var(--radius);padding:8px 10px;font-family:var(--font-body);font-size:14px;
    max-width:min(60vw,520px)}
  select:focus,input:focus{outline:none;border-color:var(--label)}
  input::placeholder{color:var(--text3)}
  select option{background:var(--surface3);color:var(--text)}

  #status{padding:16px 22px;color:var(--text2);font-size:13px}
  #status.err{color:var(--red)}
  #status:empty{display:none}
  main{padding:0 22px 60px}
  h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:28px 0 10px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--white)}

  /* ---- tables ---- */
  .wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);
    background:var(--surface3)}
  table{border-collapse:separate;border-spacing:0;font-size:14px;width:100%}
  th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--border)}
  thead th{position:sticky;top:0;background:var(--surface3);z-index:10;
    font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--label);border-bottom:1px solid var(--border2)}
  thead th[data-key]{cursor:pointer;user-select:none;transition:color .15s}
  thead th[data-key]:hover{color:var(--white)}
  thead th[data-key].sort-asc,thead th[data-key].sort-desc{color:var(--white)}
  thead th[data-key].sort-asc::after{content:" ▲";font-size:8px;color:var(--accent)}
  thead th[data-key].sort-desc::after{content:" ▼";font-size:8px;color:var(--accent)}
  td.num{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text2)}
  tr.group td{background:var(--brand);font-family:var(--font-display);font-weight:400;
    font-size:17px;color:var(--white);letter-spacing:.1em;padding:7px 14px;text-transform:uppercase;
    border-bottom:1px solid var(--border2)}
  table.players tbody tr:not(.group){cursor:pointer;transition:background .12s}
  table.players tbody tr:not(.group):hover td{background:rgba(143,189,240,.08)}
  table.players td.name{font-weight:500;color:var(--white)}
  table.players tbody tr:not(.group):hover td.name{color:var(--label)}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-family:var(--font-mono);
    font-size:9px;letter-spacing:.1em;text-transform:uppercase}
  .badge.active{background:var(--green-dim);color:var(--green)}
  .badge.out{background:var(--red-dim);color:var(--red)}
  .badge.res{background:rgba(255,255,255,.07);color:var(--text2)}
  .metanote{color:var(--text3);font-size:12px;font-family:var(--font-mono);margin:0 0 12px}

  /* ---- team directory (default browse view) ---- */
  .leaguehead{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.08em;
    color:var(--white);text-transform:uppercase;margin:26px 0 2px}
  .divhead{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--label);margin:16px 0 8px;opacity:.85}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;
    margin-bottom:8px}
  .team-card{display:flex;align-items:center;gap:10px;border:1px solid var(--border);
    border-radius:var(--radius);padding:9px 12px;background:var(--surface);cursor:pointer;
    text-align:left;transition:all .15s}
  .team-card:hover{border-color:rgba(143,189,240,.45);background:var(--surface2)}
  .team-card.home{border-color:rgba(201,36,63,.55)}
  .team-card img{width:28px;height:28px;object-fit:contain;flex:none}
  .team-card .tname{font-family:var(--font-display);font-weight:400;font-size:16px;
    letter-spacing:.04em;line-height:1.1;color:var(--text)}

  button{background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:var(--radius);padding:8px 14px;font-family:var(--font-mono);font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .15s}
  button:hover{border-color:rgba(143,189,240,.45);color:var(--label)}
  button:disabled{opacity:.35;cursor:default;border-color:var(--border);color:var(--text2)}
  @media (max-width:640px){
    .datanote{position:static;display:inline-block;margin:0 0 10px}
    h1{font-size:32px}
  }

  /* ---- player modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,10,22,.8);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-backdrop[hidden]{display:none}
  .modal{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-lg);
    max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:24px;position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .modal-close{position:absolute;top:12px;right:12px;background:none;border:1px solid var(--border);
    color:var(--text2);width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .modal-close:hover{color:var(--accent);border-color:var(--accent)}
  .modal-head{display:flex;align-items:center;gap:15px;margin-bottom:14px;padding-right:38px}
  .modal-headshot{width:74px;height:74px;border-radius:50%;object-fit:cover;background:var(--surface);
    border:2px solid var(--accent);flex:none}
  .modal-name{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:.03em;
    line-height:1;color:var(--white)}
  .modal-sub{color:var(--text2);font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;margin-top:7px}

  .tf-pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .tf-pill{background:none;color:var(--text2);border:1px solid var(--border);border-radius:20px;
    padding:6px 13px;font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;cursor:pointer;transition:all .15s}
  .tf-pill:hover{border-color:rgba(201,36,63,.5);color:var(--white)}
  .tf-pill.on{background:var(--accent);border-color:var(--accent);color:var(--white)}
  .oppRow{margin:0 0 16px}
  .oppRow[hidden]{display:none}
  .oppRow select{font-family:var(--font-mono);font-size:12px;padding:6px 9px}

  .modal-export-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
  .modal-export-btn{background:var(--accent);color:var(--white);border:1px solid var(--accent);
    border-radius:var(--radius);padding:11px 18px;font-family:var(--font-display);font-weight:400;
    font-size:17px;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;transition:all .15s}
  .modal-export-btn:hover{background:#e02c48;border-color:#e02c48;color:var(--white)}
  .modal-export-btn:disabled{opacity:.35;cursor:default;background:var(--surface);color:var(--text2);
    border-color:var(--border)}
  /* this player's card is what's on screen right now — Send has become Take Down */
  .modal-export-btn.live{background:transparent;border-color:var(--accent);color:var(--accent)}
  .modal-export-btn.live:hover{background:var(--accent-dim);color:var(--white)}
  /* only shown while this player is on air — pushes the current selection without taking it down first */
  .modal-export-btn.update{background:var(--label);border-color:var(--label);color:var(--surface3)}
  .modal-export-btn.update:hover{background:#a9d3f7;border-color:#a9d3f7;color:var(--surface3)}
  .modal-section{margin-bottom:18px}
  .modal-section h3{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--label);margin:0 0 10px;opacity:1;font-weight:500}
  .modal-line{font-family:var(--font-mono);font-size:15px;color:var(--white);margin-bottom:12px;
    letter-spacing:.02em}
  .modal-hitline{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text2);margin-bottom:6px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat-grid .cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 4px;text-align:center;cursor:pointer;position:relative;transition:all .12s;
    user-select:none}
  .stat-grid .cell:hover{border-color:rgba(201,36,63,.55)}
  .stat-grid .cell:not(.pick){opacity:.5}
  .stat-grid .cell:not(.pick):hover{opacity:.85}
  .stat-grid .cell.pick{border-color:var(--accent);background:var(--accent-dim);opacity:1}
  .stat-grid .cell.dragging{opacity:.4;cursor:grabbing}
  /* position of this stat on the bar, so the click order is visible */
  .stat-grid .cell .ord{position:absolute;top:3px;right:5px;font-family:var(--font-mono);
    font-size:8px;color:var(--accent);letter-spacing:.06em}
  .stat-grid .cell .v{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1;
    color:var(--white);letter-spacing:.02em}
  /* the stat category under each value — was 8px, which is hard to read at a glance mid-show */
  .stat-grid .cell .k{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--label);
    text-transform:uppercase;letter-spacing:.07em;margin-top:7px;opacity:1}
  .modal-empty{color:var(--text3);font-size:13px;font-family:var(--font-mono)}
  .pickhint{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text3);margin-top:9px}
  .modal-dlnote{color:var(--text3);font-size:10px;font-family:var(--font-mono);text-align:right;
    margin-top:10px;min-height:14px}
  .gamelog{width:100%;font-size:12px;margin-top:4px}
  .gamelog th,.gamelog td{padding:5px 7px}
  .gamelog th{font-family:var(--font-mono);font-size:8px;letter-spacing:.12em;color:var(--label)}
  .gamelog td{font-family:var(--font-mono);font-size:11px;color:var(--text2)}
  .gamelog td.w{color:var(--green)}
  .gamelog td.l{color:var(--red)}

  /* ---- control page: on-air status chip ---- */
  .onair{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--font-mono);
    font-size:10px;letter-spacing:.1em;color:var(--text2);text-transform:uppercase}
  .onair[hidden]{display:none}   /* author display:flex would otherwise beat the hidden attribute */
  .onair-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;
    box-shadow:0 0 0 4px var(--red-dim);animation:onair-pulse 1.6s ease-in-out infinite}
  @keyframes onair-pulse{50%{opacity:.3}}
  #onairText b{color:var(--label);font-weight:400}
  .exit-btn{background:none;color:var(--red);border:1px solid rgba(255,107,107,.4);
    border-radius:var(--radius);padding:6px 13px;font-family:var(--font-mono);font-size:9px;
    letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .15s}
  .exit-btn:hover{background:var(--red);border-color:var(--red);color:var(--surface3)}

  /* ---- Firebase link status chip ---- */
  .feed{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:9px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--text3);border:1px solid var(--border);
    border-radius:20px;padding:6px 12px}
  .feed-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex:none}
  .feed.live .feed-dot{background:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
  .feed.live{color:var(--green);border-color:rgba(95,221,170,.3)}

  /* ---- connection: which Firebase room the control page and the display share ---- */
  .connect{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;
    background:var(--accent-dim2);border:1px solid var(--border);border-radius:var(--radius);
    padding:11px 14px}
  .connect .k{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--label);opacity:.9}
  .connect input{min-width:260px;font-family:var(--font-mono);font-size:13px}
  .connect-btn{background:var(--accent);color:var(--white);border:1px solid var(--accent);
    font-family:var(--font-display);font-size:16px;letter-spacing:.06em;padding:7px 18px}
  .connect-btn:hover{background:#e02c48;border-color:#e02c48;color:var(--white)}
  .conn-pill{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--border);border-radius:20px;padding:6px 12px;color:var(--text3)}
  .conn-pill.ok{color:var(--green);border-color:rgba(95,221,170,.35);background:var(--green-dim)}
  .connect .hint{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text3);flex-basis:100%}
  .connect .hint.warn{color:var(--red)}

  /* ---- the URL to paste into the OBS machine's Browser Source ---- */
  .obsurl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
    background:var(--accent-dim2);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 13px}
  .obsurl[hidden]{display:none}
  .obsurl .k{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--label);opacity:.9}
  .obsurl code{font-family:var(--font-mono);font-size:12px;color:var(--white);
    background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:5px 9px;
    user-select:all;word-break:break-all}
  .obsurl .hint{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--text3)}

  /* ---- OBS display view (?display=1) ---- */
  #lowerThirdDisplay{display:none}
  body.display-mode #lowerThirdDisplay{display:block;position:relative;width:1920px;height:1080px}
  /* always present in the DOM (it's position:absolute, so it never affects layout) — shown/hidden and
     swapped between players purely via opacity, so bringing it on, taking it off, or switching to a
     new player all get a smooth fade instead of an instant pop */
  .lt-bar{display:flex;align-items:center;gap:24px;position:absolute;left:0;right:0;bottom:83px;
    height:200px;padding:0 44px;background-color:var(--lt-mid);
    background-image:linear-gradient(var(--accent),var(--accent)),
      linear-gradient(90deg,var(--lt-from) 0%,var(--lt-mid) 55%,var(--lt-to) 100%);
    background-repeat:no-repeat,no-repeat;background-size:100% 6px,100% 100%;
    background-position:top left,top left;
    box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .35s ease}
  .lt-bar.lt-visible{opacity:1}
  .lt-headshot{width:152px;height:152px;border-radius:50%;object-fit:cover;background:var(--lt-mid);
    border:4px solid var(--accent);flex:none}
  .lt-info{flex:none;min-width:0}
  .lt-name{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:68px;line-height:1;
    letter-spacing:.02em;color:#ffffff;white-space:nowrap}
  .lt-sub{font-family:'DM Mono',monospace;font-weight:500;font-size:22px;color:var(--label);
    text-transform:uppercase;letter-spacing:.16em;white-space:nowrap;margin-top:11px}
  .lt-divider{width:1px;align-self:stretch;margin:36px 0;background:rgba(255,255,255,.18);flex:none}
  .lt-stats{flex:1;min-width:0;text-align:center}
  .lt-hitline{font-family:'DM Mono',monospace;font-weight:500;font-size:20px;letter-spacing:.16em;
    color:rgba(255,255,255,.7);text-transform:uppercase;margin-bottom:10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lt-hitline .split{color:var(--accent);font-weight:500}
  /* never wraps to a second row — sizeCells() in JS shrinks cell width + font to fit whatever
     count of stats is on screen, in one line, same as the canvas PNG export does */
  .lt-cells{display:flex;justify-content:center;align-items:flex-end;gap:0;flex-wrap:nowrap;width:100%}
  /* Cells size to their content rather than to a fixed width, and every value on the bar shares
     one font size (set by sizeCells). A fixed width forced wide values like 216/339 to shrink on
     their own, so they sat noticeably smaller than 2,272 next door and read as squished. */
  .lt-cells .lt-cell{flex:0 0 auto;width:auto;min-width:96px;text-align:center;padding:0 14px}
  .lt-cell .v{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:76px;line-height:1;
    color:#ffffff;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
  .lt-cell .k{font-family:'DM Mono',monospace;font-weight:500;font-size:17px;color:var(--label);
    text-transform:uppercase;letter-spacing:.14em;white-space:nowrap;overflow:hidden;margin-top:10px}
  .lt-watermark{position:absolute;right:24px;bottom:14px;font-family:'DM Mono',monospace;
    font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.3);text-transform:uppercase}
  body.display-mode{background:transparent}
  body.display-mode header, body.display-mode main, body.display-mode #status,
  body.display-mode .modal-backdrop{display:none}
</style>
</head>
<body>
<header>
  <div class="datanote" id="datanote">Data <b>Live via ESPN</b></div>
  <div class="eyebrow">Talkin' Giants</div>
  <div class="titlerow">
    <h1>STAT SNAPSHOT<span>.</span></h1>
    <button id="goHome" class="home-btn" type="button" title="Back to all 32 teams">⌂ All Teams</button>
    <button id="goGiants" class="home-btn" type="button" title="Jump to the Giants roster">Giants</button>
    <div class="teambadge" id="teambadge"></div>
  </div>
  <div class="controls">
    <div><label for="season">Season</label><select id="season"></select></div>
    <div><label for="division">Division</label><select id="division"><option value="">All Divisions</option></select></div>
    <div><label for="team">Team</label><select id="team"><option value="">Select a team…</option></select></div>

<script>
// =====================================================================================
// Config
// =====================================================================================

// The show's wordmark, baked into the bar and the PNG. Colours live in :root above.
const WORDMARK = "TALKIN' GIANTS";
const HOME_TEAM_ID = 19;              // New York Giants (ESPN team id)

// ESPN's public endpoints — no API key. Everything we actually fetch (rosters, game logs, career
// stats) sends Access-Control-Allow-Origin, so this works straight off GitHub Pages with no proxy.
// One host for both path trees; site.api.espn.com serves the same site/v2 data if this one ever
// moves. The notable exception is /teams, which sends no CORS header on either host and so can't
// be read from a browser at all — see the static team table below for how that's handled.
const HOST = 'https://site.web.api.espn.com';
const SITE = `${HOST}/apis/site/v2/sports/football/nfl`;
const WEB  = `${HOST}/apis/common/v3/sports/football/nfl`;

const j = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + ' → ' + r.status); return r.json(); });
const jCache = new Map();
const jc = u => (jCache.has(u) ? jCache.get(u) : (jCache.set(u, j(u)), jCache.get(u)));
const $ = id => document.getElementById(id);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

const params = new URLSearchParams(location.search);
const isDisplayMode = params.get('display') === '1';
if (isDisplayMode) document.body.classList.add('display-mode');

const LT_KEY = 'tg-lower-third-onair';
const TOPIC_KEY = 'tg-snapshot-topic';
let TOPIC = params.get('topic') || '';
const ltChannel = 'BroadcastChannel' in window ? new BroadcastChannel('tg-lower-third') : null;

const logoURL = abbr => `https://a.espncdn.com/i/teamlogos/nfl/500/${String(abbr).toLowerCase()}.png`;
const headshotURL = pid => `https://a.espncdn.com/i/headshots/nfl/players/full/${pid}.png`;

function say(msg, isErr) { $('status').textContent = msg || ''; $('status').className = isErr ? 'err' : ''; }

// one place to change the show name — the bar's watermark follows it
if ($('ltWatermark')) $('ltWatermark').textContent = WORDMARK;

// =====================================================================================
// Firebase transport (shared Jomboy project — same one Prompter and both Pinpoints use)
// =====================================================================================
// Replaces the ntfy topic the baseball version uses. RTDB pushes to every subscriber over one
// socket the SDK keeps alive itself, so there's no SSE-stalls-behind-a-proxy problem to paper
// over with a polling safety net, and the last value is stored server-side — an OBS Browser
// Source that refreshes mid-show gets the current graphic back on connect, for free.

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBG2PS2muH4i27HefuLeBnZWW-TZ5dkMCw",
  authDomain: "pinpoint-abf21.firebaseapp.com",
  databaseURL: "https://pinpoint-abf21-default-rtdb.firebaseio.com",
  projectId: "pinpoint-abf21",
  storageBucket: "pinpoint-abf21.firebasestorage.app",
  messagingSenderId: "947703489099",
  appId: "1:947703489099:web:c4ed96cfbaeeda594463ce"
};

let _db = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  _db = firebase.database();
} catch (e) { /* offline / SDK blocked — the app still works, just without the OBS link */ }

const roomKey = t => String(t || '').trim().replace(/[.#$\[\]\/\s]+/g, '-');
function onAirRef() {
  if (!_db || !TOPIC) return null;
  return _db.ref('nflstats/' + roomKey(TOPIC) + '/onair');
}

function setFeed(live) {
  const chip = $('feedChip'); if (!chip) return;
  chip.classList.toggle('live', !!live);
  $('feedText').textContent = live ? 'live (Firebase)' : 'offline';
}
if (_db) _db.ref('.info/connected').on('value', s => setFeed(!!s.val()));
else setFeed(false);

function setConn(ok) {
  const pill = $('connStatus'); if (!pill) return;
  pill.classList.toggle('ok', !!ok);
  pill.textContent = ok ? 'connected' : 'not connected';
  const btn = $('copyDisplayBtn'); if (btn) btn.disabled = !ok;
