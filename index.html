    box.hidden = !ok;
    if (ok) $('obsUrlText').textContent = displayURL();
  }
}

// Writes the on-air payload to the room. `null` clears it.
function publishTopic(payload) {
  const ref = onAirRef();
  if (!ref) return;
  if (!payload) { ref.remove().catch(() => {}); return; }
  ref.set({ ...payload, ts: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
}

// =====================================================================================
// Teams / divisions
// =====================================================================================
// The 32 clubs are a static table, not a fetch. Two reasons, and the first is the hard one:
//
//   1. ESPN's /teams endpoint sends no Access-Control-Allow-Origin header — on either host, while
//      its /roster sibling on the same host does send one. A browser hard-fails a cross-origin
//      fetch when that header is missing, so a page simply cannot read /teams. Nothing to work
//      around client-side; it has to not be called.
//   2. The data is frozen anyway. Ids, abbreviations and division alignment haven't moved since
//      the Commanders rename in 2022, and realignment before that was 2002.
//
// Ids and names below came from that endpoint (read server-side, where CORS doesn't apply). Team
// colours aren't here because nothing uses them — the palette is the show's, not each club's.
// [abbr, espnId, displayName]

const ALIGNMENT = {
  AFC: {
    East:  [['BUF', 2, 'Buffalo Bills'], ['MIA', 15, 'Miami Dolphins'], ['NE', 17, 'New England Patriots'], ['NYJ', 20, 'New York Jets']],
    North: [['BAL', 33, 'Baltimore Ravens'], ['CIN', 4, 'Cincinnati Bengals'], ['CLE', 5, 'Cleveland Browns'], ['PIT', 23, 'Pittsburgh Steelers']],
    South: [['HOU', 34, 'Houston Texans'], ['IND', 11, 'Indianapolis Colts'], ['JAX', 30, 'Jacksonville Jaguars'], ['TEN', 10, 'Tennessee Titans']],
    West:  [['DEN', 7, 'Denver Broncos'], ['KC', 12, 'Kansas City Chiefs'], ['LV', 13, 'Las Vegas Raiders'], ['LAC', 24, 'Los Angeles Chargers']],
  },
  NFC: {
    East:  [['DAL', 6, 'Dallas Cowboys'], ['NYG', 19, 'New York Giants'], ['PHI', 21, 'Philadelphia Eagles'], ['WSH', 28, 'Washington Commanders']],
    North: [['CHI', 3, 'Chicago Bears'], ['DET', 8, 'Detroit Lions'], ['GB', 9, 'Green Bay Packers'], ['MIN', 16, 'Minnesota Vikings']],
    South: [['ATL', 1, 'Atlanta Falcons'], ['CAR', 29, 'Carolina Panthers'], ['NO', 18, 'New Orleans Saints'], ['TB', 27, 'Tampa Bay Buccaneers']],
    West:  [['ARI', 22, 'Arizona Cardinals'], ['LAR', 14, 'Los Angeles Rams'], ['SF', 25, 'San Francisco 49ers'], ['SEA', 26, 'Seattle Seahawks']],
  },
};

const DIV_OF = {};               // abbr -> {conf, div, short} e.g. NYG -> {..., short:'NFC East'}
let teamsById = new Map();       // id (string) -> {id, abbr, name, div}
let divisions = [];              // [{conf, div, short, teams:[...]}] in display order
let currentTeamId = null;
let currentView = 'directory';

function buildTeams() {
  divisions = [];
  teamsById = new Map();
  Object.entries(ALIGNMENT).forEach(([conf, divs]) =>
    Object.entries(divs).forEach(([div, rows]) => {
      const short = `${conf} ${div}`;
      const list = rows.map(([abbr, id, name]) => {
        DIV_OF[abbr] = { conf, div, short };
        const t = { id: String(id), abbr, name, div: { conf, div, short } };
        teamsById.set(t.id, t);
        return t;
      }).sort((a, b) => a.name.localeCompare(b.name));
      divisions.push({ conf, div, short, teams: list });
    }));

  $('division').innerHTML = '<option value="">All Divisions</option>' +
    divisions.map(dv => `<option value="${dv.short}">${dv.short}</option>`).join('');
  populateTeamSelect();
}

function populateTeamSelect(divFilter) {
  const list = divFilter ? divisions.filter(dv => dv.short === divFilter) : divisions;
  const opts = list.map(dv =>
    `<optgroup label="${dv.short}">` +
    dv.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('') +
    `</optgroup>`).join('');
  $('team').innerHTML = '<option value="">Select a team…</option>' + opts;
}

function setTeamBadge(team) {
  const box = $('teambadge');
  if (!team) { box.innerHTML = ''; return; }
  box.innerHTML = `<img src="${logoURL(team.abbr)}" alt="${team.name}" onerror="this.remove()">` +
    `<span class="tn">${team.name}</span>`;
}

// =====================================================================================
// Directory (default browse view) — all 32, by conference and division
// =====================================================================================

function renderDirectory(divFilter) {
  currentView = 'directory';
  setTeamBadge(null);
  const out = $('out'); out.innerHTML = '';
  say('');
  const list = divFilter ? divisions.filter(dv => dv.short === divFilter) : divisions;
  let curConf = null;
  list.forEach(dv => {
    if (dv.conf !== curConf) { out.appendChild(el('div', 'leaguehead', dv.conf)); curConf = dv.conf; }
    out.appendChild(el('div', 'divhead', dv.short));
    const grid = el('div', 'team-grid');
    dv.teams.forEach(t => {
      const card = el('button', 'team-card' + (+t.id === HOME_TEAM_ID ? ' home' : ''));
      card.type = 'button';
      card.innerHTML = `<img src="${logoURL(t.abbr)}" alt="" onerror="this.remove()"><span class="tname">${t.name}</span>`;
      card.onclick = () => { $('team').value = t.id; $('division').value = dv.short; guard(loadRoster)(t.id); };
      grid.appendChild(card);
    });
    out.appendChild(grid);
  });
}

// =====================================================================================
// Roster
// =====================================================================================
// ESPN groups the roster for us — offense / defense / specialTeam / injuredReserveOrOut /
// suspended / practiceSquad — which maps onto the baseball tool's Active / IL / Reserve split
// more cleanly than the 40-man does.

const GROUP_LABELS = {
  offense: ['OFFENSE', 'active'],
  defense: ['DEFENSE', 'active'],
  specialTeam: ['SPECIAL TEAMS', 'active'],
  injuredReserveOrOut: ['INJURED RESERVE / OUT', 'out'],
  suspended: ['SUSPENDED', 'out'],
  practiceSquad: ['PRACTICE SQUAD', 'res'],
};
const GROUP_ORDER = ['offense', 'defense', 'specialTeam', 'injuredReserveOrOut', 'suspended', 'practiceSquad'];

const POS_ORDER = { QB:1, RB:2, FB:3, WR:4, TE:5, OT:6, G:7, C:8, LS:9, DE:10, DT:11, NT:12,
                    LB:13, OLB:14, ILB:15, MLB:16, CB:17, S:18, FS:19, SS:20, PK:21, K:22, P:23 };
const posRank = p => POS_ORDER[p] ?? 50;

// Pull just the fields we need — the raw roster payload is ~430KB a team, most of it contracts
// and link blobs we never look at, and the background index holds all 32 in memory at once.
function slimRoster(data) {
  const rows = [];
  (data.athletes || []).forEach(g => {
    (g.items || []).forEach(a => {
      rows.push({
        id: String(a.id),
        name: a.fullName || a.displayName || '',
        pos: (a.position && a.position.abbreviation) || '',
        number: a.jersey || '',
        group: g.position,
        injury: (a.injuries || []).length ? ((a.injuries[0].type || a.injuries[0].status || '') + '') : '',
      });
    });
  });
  return rows;
}

async function loadRoster(teamId) {
  currentTeamId = String(teamId); currentView = 'roster';
  const team = teamsById.get(String(teamId));
  setTeamBadge(team);
  $('find').value = '';
  say('Loading roster…');
  let rows;
  try {
    rows = slimRoster(await jc(`${SITE}/teams/${teamId}/roster`));
  } catch (e) { say('Could not load that roster: ' + e.message, true); return; }
  say('');
  rosterState = { team, rows };
  sortState = { table: 'roster', key: null, dir: 1 };
  paintRoster();
}

function sortRows(rows, key, dir) {
  if (!key) return rows;
  return [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === 'number') {
      av = av === '' || av == null ? null : +av; bv = bv === '' || bv == null ? null : +bv;
      if (av === null && bv === null) return 0;
      if (av === null) return 1; if (bv === null) return -1;
      return (av - bv) * dir;
    }
    av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase();
    if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0;
  });
}

function sortableTh(label, key, tbl) {
  const th = el('th', null, label);
  th.dataset.key = key; th.dataset.tbl = tbl;
  if (sortState.table === tbl && sortState.key === key) th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');
  return th;
}

function paintRoster() {
  if (!rosterState) return;
  const { team, rows } = rosterState;
  currentIndex = new Map();
  rows.forEach(r => currentIndex.set(r.id, {
    id: r.id, name: r.name, pos: r.pos, team: team ? team.name : '',
    teamAbbr: team ? team.abbr : '', teamId: team ? team.id : null,
  }));

  const table = el('table', 'players');
  const thead = el('thead'); const hr = el('tr');
  hr.appendChild(sortableTh('#', 'number', 'roster'));
  hr.appendChild(sortableTh('Name', 'name', 'roster'));
  hr.appendChild(sortableTh('Pos', 'pos', 'roster'));
  hr.appendChild(sortableTh('Status', 'group', 'roster'));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el('tbody');
  const active = sortState.table === 'roster' ? sortState : null;

  GROUP_ORDER.forEach(gk => {
    const [label, badgeCls] = GROUP_LABELS[gk] || [gk.toUpperCase(), 'res'];
    let g = rows.filter(r => r.group === gk);
    g = active && active.key
      ? sortRows(g, active.key, active.dir)
      : g.sort((a, b) => posRank(a.pos) - posRank(b.pos) || a.name.localeCompare(b.name));
    if (!g.length) return;
    const trG = el('tr', 'group');
    const tdG = el('td', null, `${label} (${g.length})`); tdG.colSpan = 4;
    trG.appendChild(tdG); tbody.appendChild(trG);
    g.forEach(r => {
      const tr = el('tr'); tr.dataset.pid = r.id;
      tr.appendChild(el('td', 'num', r.number));
      tr.appendChild(el('td', 'name', r.name));
      tr.appendChild(el('td', null, r.pos));
      const badgeText = r.injury || (badgeCls === 'active' ? 'Active' : badgeCls === 'out' ? 'Out' : 'Practice Squad');
      tr.appendChild(el('td', null, '')).innerHTML =
        `<span class="badge ${r.injury ? 'out' : badgeCls}">${badgeText}</span>`;
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  addTable(`${team ? team.name : 'Team'} Roster`, table);
}

function addTable(title, table, note) {
  const out = $('out'); out.innerHTML = '';
  out.appendChild(el('h2', null, title));
  if (note) out.appendChild(el('div', 'metanote', note));
  if (table) { const w = el('div', 'wrap'); w.appendChild(table); out.appendChild(w); }
}

// =====================================================================================
// Global search — progressive league-wide index
// =====================================================================================
// The baseball tool gets a whole-league player index in one call. ESPN has no equivalent: its
// league-wide athlete list is 20k entries deep, paged 25 at a time, and carries no team or
// position — useless for a search table with Pos and Team columns. So the index is built from
// the 32 team rosters instead, in the background, a few at a time: the Giants land first so the
// page is usable immediately, and search works against whatever has arrived so far rather than
// blocking on all 32.

let allPlayers = [];             // [{id,name,pos,number,teamId,teamName,teamAbbr}]
let indexedTeams = new Set();
let indexing = false;

async function buildPlayerIndex() {
  if (indexing) return;
  indexing = true;
  const ids = [String(HOME_TEAM_ID), ...[...teamsById.keys()].filter(id => +id !== HOME_TEAM_ID)];
  const CONCURRENCY = 6;         // enough to finish quickly, gentle enough not to look like a scrape
  let cursor = 0;

  const worker = async () => {
    while (cursor < ids.length) {
      const id = ids[cursor++];
      if (indexedTeams.has(id)) continue;
      const team = teamsById.get(id);
      try {
        const rows = slimRoster(await jc(`${SITE}/teams/${id}/roster`));
        rows.forEach(r => allPlayers.push({
          id: r.id, name: r.name, pos: r.pos, number: r.number,
          teamId: id, teamName: team ? team.name : '', teamAbbr: team ? team.abbr : '',
        }));
        indexedTeams.add(id);
      } catch { /* one team failing shouldn't stop the index */ }
      updateIndexNote();
    }
  };
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  indexing = false;
  updateIndexNote();
  // If the user typed while it was still filling, repaint against the finished index.
  if (currentView === 'search' && $('find').value.trim()) renderSearchResults($('find').value);
}

function updateIndexNote() {
  const n = indexedTeams.size;
  const note = $('datanote');
  if (!note) return;
  note.innerHTML = n >= 32
    ? 'Data <b>Live via ESPN</b>'
    : `Data <b>Live via ESPN</b> · indexing ${n}/32`;
}

let currentIndex = new Map();
let rosterState = null;
let searchState = null;
let sortState = { table: null, key: null, dir: 1 };

function renderSearchResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) { searchState = null; renderDirectory($('division').value); return; }
  currentView = 'search';
  setTeamBadge(null);
  const matches = allPlayers.filter(p => p.name.toLowerCase().includes(q));
  say('');
  const stillIndexing = indexedTeams.size < 32;
  if (!matches.length) {
    searchState = null;
    addTable(`Search — "${query}"`, null, stillIndexing
      ? `No matches yet — still indexing (${indexedTeams.size}/32 teams). Try again in a moment.`
      : 'No players matched that search.');
    return;
  }

  const LIMIT = 80;
  const shown = matches.slice(0, LIMIT);
  const byTeam = new Map();
  shown.forEach(p => {
    if (!byTeam.has(p.teamId)) byTeam.set(p.teamId, []);
    byTeam.get(p.teamId).push(p);
  });
  const teamGroups = [...byTeam.entries()]
    .map(([tid, players]) => ({ team: teamsById.get(tid), players }))
    .sort((a, b) => (a.team ? a.team.name : '').localeCompare(b.team ? b.team.name : ''));

  searchState = { query, teamGroups, total: matches.length, limit: LIMIT, stillIndexing };
  sortState = { table: 'search', key: null, dir: 1 };
  paintSearch();
}

function paintSearch() {
  if (!searchState) return;
  const { query, teamGroups, total, limit, stillIndexing } = searchState;
  currentIndex = new Map();
  const table = el('table', 'players');
  const thead = el('thead'); const hr = el('tr');
  hr.appendChild(sortableTh('#', 'number', 'search'));
  hr.appendChild(sortableTh('Name', 'name', 'search'));
  hr.appendChild(sortableTh('Pos', 'pos', 'search'));
  hr.appendChild(sortableTh('Team', 'teamName', 'search'));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el('tbody');
  const active = sortState.table === 'search' ? sortState : null;
  teamGroups.forEach(({ team, players }) => {
    const trG = el('tr', 'group');
    const tdG = el('td', null, team ? team.name : 'Unknown Team'); tdG.colSpan = 4;
    trG.appendChild(tdG); tbody.appendChild(trG);
    const rows = active && active.key ? sortRows(players, active.key, active.dir)
                                      : [...players].sort((a, b) => a.name.localeCompare(b.name));
    rows.forEach(p => {
      currentIndex.set(p.id, { id: p.id, name: p.name, pos: p.pos, team: p.teamName,
                               teamAbbr: p.teamAbbr, teamId: p.teamId });
      const tr = el('tr'); tr.dataset.pid = p.id;
      tr.appendChild(el('td', 'num', p.number));
      tr.appendChild(el('td', 'name', p.name));
      tr.appendChild(el('td', null, p.pos));
      tr.appendChild(el('td', null, p.teamName));
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  const notes = [];
  if (total > limit) notes.push(`Showing first ${limit} of ${total} matches — refine to narrow it down.`);
  if (stillIndexing) notes.push(`Still indexing (${indexedTeams.size}/32 teams) — more may appear.`);
  addTable(`Search — "${query}"`, table, notes.join(' '));
}

// =====================================================================================
// Stat vocabulary
// =====================================================================================
// ESPN hands back parallel arrays: `names` (machine keys, unique) and `labels` (display, and NOT
// unique — YDS/AVG/TD each appear twice for a skill player, once for rushing and once for
// receiving). So everything keys off `names`, and labels get disambiguated here.

const NICE_LABEL = {
  gamesPlayed:'GP',
  completions:'CMP', passingAttempts:'ATT', passingYards:'PASS YDS', completionPct:'CMP%',
  yardsPerPassAttempt:'Y/ATT', passingTouchdowns:'PASS TD', interceptions:'INT',
  longPassing:'LNG PASS', sacks:'SACK', QBRating:'RTG', adjQBR:'QBR',
  rushingAttempts:'CAR', rushingYards:'RUSH YDS', yardsPerRushAttempt:'Y/CAR',
  rushingTouchdowns:'RUSH TD', longRushing:'LNG RUN', rushingFirstDowns:'RUSH FD',
  receptions:'REC', receivingTargets:'TGTS', receivingYards:'REC YDS',
  yardsPerReception:'Y/REC', receivingTouchdowns:'REC TD', longReception:'LNG REC',
  fumbles:'FUM', fumblesLost:'FUM LOST', fumblesForced:'FF', fumblesRecovered:'FR',
  fumblesRecoveredYards:'FR YDS',
  totalTackles:'TOT', soloTackles:'SOLO', assistTackles:'AST', stuffs:'TFL', stuffYards:'TFL YDS',
  kicksBlocked:'BLK', passesDefended:'PD',
  interceptionYards:'INT YDS', avgInterceptionYards:'INT AVG', interceptionTouchdowns:'INT TD',
  longInterception:'LNG INT',
  punts:'PUNTS', puntYards:'PUNT YDS', grossAvgPuntYards:'AVG', netAvgPuntYards:'NET',
  longPunt:'LNG', touchbacks:'TB', touchbackPct:'TB%', puntsInside20:'IN20', puntsInside20Pct:'IN20%',
  puntReturns:'PR', puntReturnYards:'PR YDS', avgPuntReturnYards:'PR AVG', longPuntReturn:'LNG PR',
  kickReturns:'KR', kickReturnYards:'KR YDS', longKickReturn:'LNG KR',
  fieldGoalPct:'FG%', longFieldGoalMade:'LNG FG', fieldGoalsMadeYardsAverage:'FG AVG',
  totalKickingPoints:'PTS', totalPoints:'PTS', totalTouchdowns:'TD',
  returnTouchdowns:'RET TD', totalTwoPointConvs:'2PT', kickExtraPoints:'XP', fieldGoals:'FG',
  'fieldGoalsMade-fieldGoalAttempts':'FG',
  'extraPointsMade-extraPointAttempts':'XP',
  'fieldGoalsMade1_19-fieldGoalAttempts1_19':'FG 1-19',
  'fieldGoalsMade20_29-fieldGoalAttempts20_29':'FG 20-29',
  'fieldGoalsMade30_39-fieldGoalAttempts30_39':'FG 30-39',
  'fieldGoalsMade40_49-fieldGoalAttempts40_49':'FG 40-49',
  'fieldGoalsMade50-fieldGoalAttempts50':'FG 50+',
};
const labelFor = (name, fallback) => NICE_LABEL[name] || (fallback || name || '').trim();

// ESPN's own label for a stat name, remembered the first time we see it — the fallback when
// NICE_LABEL has no entry, so a category we've never met still renders a sensible header.
const LABEL_HINT = {};

// Longest-of, not sum-of.
const MAX_STATS = new Set(['longPassing', 'longRushing', 'longReception', 'longInterception',
  'longPunt', 'longFieldGoalMade', 'longKickReturn', 'longPuntReturn']);

// Rate stats can't be added up, so they get recomputed from their components after the counting
// stats have been summed. [numerator, denominator, kind, decimals]
const DERIVED = {
  completionPct:        ['completions', 'passingAttempts', 'pct', 1],
  yardsPerPassAttempt:  ['passingYards', 'passingAttempts', 'ratio', 1],
  yardsPerRushAttempt:  ['rushingYards', 'rushingAttempts', 'ratio', 1],
  yardsPerReception:    ['receivingYards', 'receptions', 'ratio', 1],
  avgInterceptionYards: ['interceptionYards', 'interceptions', 'ratio', 1],
  grossAvgPuntYards:    ['puntYards', 'punts', 'ratio', 1],
  touchbackPct:         ['touchbacks', 'punts', 'pct', 2],
  puntsInside20Pct:     ['puntsInside20', 'punts', 'pct', 2],
  avgPuntReturnYards:   ['puntReturnYards', 'puntReturns', 'ratio', 1],
  fieldGoalPct:         ['fieldGoalsMade', 'fieldGoalAttempts', 'pct', 1],
};

// No way to reconstruct these from per-game rows, so a multi-game window just drops them rather
// than showing a number that's quietly wrong. ESPN's own season/career totals still carry them.
const UNAGGREGATABLE = new Set(['adjQBR', 'QBR', 'netAvgPuntYards', 'fieldGoalsMadeYardsAverage']);

const num = v => {
  if (v == null) return NaN;
  const s = String(v).replace(/,/g, '').trim();
  if (s === '' || s === '-' || s === '--') return NaN;
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
};
// Thousands separator on the big counting stats, matching how ESPN (and every broadcast graphic)
// writes them — a season passing total reads as 2,272, not 2272. Rate stats never get here.
const fmtNum = n => {
  if (!Number.isInteger(n)) return n.toFixed(1);
  return Math.abs(n) >= 1000 ? n.toLocaleString('en-US') : String(n);
};

// NFL passer rating — the one derived stat with a formula rather than a ratio, and worth keeping
// because it's the number people actually say out loud about a quarterback.
function passerRating(cmp, att, yds, td, ints) {
  if (!att) return null;
  const clamp = x => Math.max(0, Math.min(2.375, x));
  const a = clamp((cmp / att - 0.3) * 5);
  const b = clamp((yds / att - 3) * 0.25);
  const c = clamp((td / att) * 20);
  const d = clamp(2.375 - (ints / att) * 25);
  return ((a + b + c + d) / 6 * 100).toFixed(1);
}

// =====================================================================================
// Game log — one fetch drives every multi-game timeframe
// =====================================================================================
// The gamelog payload already carries week, opponent, home/away and result per game, so Last 3,
// Last 5, Home, Away, vs Division and vs a specific opponent are all filters over the same
// response. Two requests per player, total (this plus career), against the baseball tool's one
// per timeframe.

async function fetchGameLog(pid, year) {
  const d = await jc(`${WEB}/athletes/${pid}/gamelog?season=${year}`);
  const names = d.names || [];
  const labels = (d.labels || []).map(s => (s || '').trim());
  const events = d.events || {};
  const games = [];
  let dropped = 0;
  (d.seasonTypes || []).forEach(stype => {
    (stype.categories || []).forEach(cat => {
      (cat.events || []).forEach(e => {
        const meta = events[e.eventId] || {};
        const opp = meta.opponent || {};
        // Skip anything whose opponent isn't one of the 32 clubs. That's the Pro Bowl: ESPN files
        // it under "Postseason" with the opponent listed as AFC or NFC, so without this an all-star
        // game lands in "Last 3", inflates career totals, and shows up as a selectable opponent
        // called AFC. Real playoff games have a real club as the opponent and are kept.
        if (!DIV_OF[(opp.abbreviation || '').toUpperCase()]) { dropped++; return; }
        games.push({
          eventId: e.eventId,
          stats: e.stats || [],
          week: meta.week,
          date: meta.gameDate,
          home: meta.atVs === 'vs',
          result: meta.gameResult,
          score: meta.score,
          oppAbbr: opp.abbreviation || '',
          oppName: opp.displayName || '',
          seasonType: stype.displayName || '',
        });
      });
    });
  });
  // ESPN returns newest-first inside a category, but not necessarily across season types, so
  // sort it ourselves — "last 3 games" has to mean the actual last 3.
  games.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  // ESPN's own regular-season totals: authoritative, and they include the stats we can't derive.
  let totals = null;
  const reg = (d.seasonTypes || []).find(s => /regular/i.test(s.displayName || ''));
  if (reg && (reg.categories || []).length) totals = (reg.categories[0] || {}).totals || null;

  return { names, labels, games, totals, dropped };
}

// =====================================================================================
// Preseason — ESPN's athlete gamelog endpoint above never returns preseason games at all (checked
// live: a 2026 preseason game already played on the wire came back with zero events), so it can't
// feed the same pipeline as the regular season. Preseason box scores only exist per-game, off the
// team schedule — one schedule call to find which preseason games happened, then one boxscore call
// per game to pull this player's line out of it. That keeps it a completely separate fetch from
// fetchGameLog/fetchCareer, which is what keeps preseason out of the season and career totals: this
// data never passes through the code that computes those.
// =====================================================================================

// Every category except passing/kicking is a flat one-to-one copy from ESPN's broadcast label to
// our internal stat name (the same vocabulary labelFor/CELL_SPEC/aggregate already use).
const SIMPLE_BOX_MAP = {
  rushing:       { CAR: 'rushingAttempts', YDS: 'rushingYards', TD: 'rushingTouchdowns', LONG: 'longRushing' },
  receiving:     { REC: 'receptions', YDS: 'receivingYards', TD: 'receivingTouchdowns', LONG: 'longReception', TGTS: 'receivingTargets' },
  defensive:     { TOT: 'totalTackles', SOLO: 'soloTackles', SACKS: 'sacks', TFL: 'stuffs', PD: 'passesDefended' },
  interceptions: { INT: 'interceptions', YDS: 'interceptionYards', TD: 'interceptionTouchdowns' },
  punting:       { NO: 'punts', YDS: 'puntYards', TB: 'touchbacks', 'In 20': 'puntsInside20', LONG: 'longPunt' },
  kickReturns:   { NO: 'kickReturns', YDS: 'kickReturnYards', LONG: 'longKickReturn' },
  puntReturns:   { NO: 'puntReturns', YDS: 'puntReturnYards', LONG: 'longPuntReturn' },
};

// A boxscore's stat categories use ESPN's broadcast-style labels (C/ATT, SACKS as "1-1", FG as
// "2/2"), not the gamelog's machine names — mapped here onto that exact same vocabulary so the rest
// of the app (labelFor, CELL_SPEC, aggregate's derived/max-of rules) doesn't need to know the
// difference.
function boxRowToMap(category, labels, stats) {
  const val = label => { const i = labels.indexOf(label); return i < 0 ? undefined : stats[i]; };
  const pair = raw => {
    const m = /^(-?[\d.]+)\s*\/\s*(-?[\d.]+)$/.exec(String(raw == null ? '' : raw));
    return m ? [m[1], m[2]] : [undefined, undefined];
  };
  const m = {};
  const set = (name, v) => { if (v != null && v !== '') m[name] = v; };
  if (category === 'passing') {
    const [c, a] = pair(val('C/ATT'));
    set('completions', c); set('passingAttempts', a);
    set('passingYards', val('YDS')); set('passingTouchdowns', val('TD'));
    set('interceptions', val('INT'));
    set('sacks', String(val('SACKS') || '').split('-')[0]);
  } else if (category === 'kicking') {
    const [fm, fa] = pair(val('FG')), [xm, xa] = pair(val('XP'));
    if (fm != null) m['fieldGoalsMade-fieldGoalAttempts'] = `${fm}-${fa}`;
    if (xm != null) m['extraPointsMade-extraPointAttempts'] = `${xm}-${xa}`;
    set('longFieldGoalMade', val('LONG')); set('totalKickingPoints', val('PTS'));
  } else {
    Object.entries(SIMPLE_BOX_MAP[category] || {}).forEach(([label, name]) => set(name, val(label)));
  }
  return m;
}

// Every category from both teams' box scores that has a row for this player, merged into one map —
// a player only ever shows up in the categories for their own position, so there's nothing to pick
// a side over.
function preseasonBoxMap(players, pid) {
  const map = {};
  (players || []).forEach(team => (team.statistics || []).forEach(cat => {
    const row = (cat.athletes || []).find(a => a.athlete && String(a.athlete.id) === String(pid));
    if (row) Object.assign(map, boxRowToMap(cat.name, cat.labels || [], row.stats || []));
  }));
  return map;
}

async function fetchPreseasonGames(pid, teamId, year) {
  if (!teamId) return { names: [], games: [] };
  const sched = await jc(`${SITE}/teams/${teamId}/schedule?season=${year}&seasontype=1`).catch(() => null);
  const played = (sched && sched.events || []).filter(e => e.competitions?.[0]?.status?.type?.completed);

  const games = [];
  for (const e of played) {
    const comp = (e.competitions || [])[0] || {};
    const summary = await jc(`${SITE}/summary?event=${e.id}`).catch(() => null);
    if (!summary) continue;
    const map = preseasonBoxMap((summary.boxscore || {}).players, pid);
    if (!Object.keys(map).length) continue;    // didn't play (inactive / DNP) in this one
    const competitors = comp.competitors || [];
    const me = competitors.find(c => c.team && String(c.team.id) === String(teamId));
    const opp = competitors.find(c => c !== me) || {};
    const myScore = me && me.score ? +me.score.value : null, oppScore = opp.score ? +opp.score.value : null;
    games.push({
      week: null, date: e.date,
      home: me ? me.homeAway === 'home' : null,
      result: myScore != null && oppScore != null ? (myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'T') : '',
      score: myScore != null && oppScore != null ? `${myScore}-${oppScore}` : '',
      oppAbbr: (opp.team || {}).abbreviation || '',
      seasonType: 'Preseason',
      map,
    });
  }
  games.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  const names = [];
  games.forEach(g => Object.keys(g.map).forEach(n => { if (!names.includes(n)) names.push(n); }));
  return { names, games };
}

// Turn a values array into a {name: rawString} map.
const toMap = (names, vals) => {
  const m = {};
  names.forEach((n, i) => { m[n] = (vals || [])[i]; });
  return m;
};

// Sum a set of per-game rows into one stat map, honouring max-of / derived / drop rules.
// Compound "made-attempts" keys (the kicking ones, e.g. "8-8") are split into their two halves so
// they can be summed and re-joined — and so fieldGoalPct has real components to derive from.
function aggregate(names, rows) {
  const sums = {};        // name -> number
  const pairs = {};       // compound name -> [madeTotal, attTotal]
  const maxes = {};

  rows.forEach(vals => {
    names.forEach((name, i) => {
      const raw = (vals || [])[i];
      if (raw == null) return;
      if (name.includes('-')) {
        const m = String(raw).match(/^(-?[\d.]+)\s*-\s*(-?[\d.]+)$/);
        if (!m) return;
        const [a, b] = [parseFloat(m[1]), parseFloat(m[2])];
        if (!pairs[name]) pairs[name] = [0, 0];
        pairs[name][0] += a; pairs[name][1] += b;
        // expose the halves under their component names so DERIVED can find them
        const [ln, rn] = name.split('-');
        sums[ln] = (sums[ln] || 0) + a;
        sums[rn] = (sums[rn] || 0) + b;
        return;
      }
      const n = num(raw);
      if (isNaN(n)) return;
      if (MAX_STATS.has(name)) { maxes[name] = Math.max(maxes[name] ?? -Infinity, n); return; }
      if (DERIVED[name] || UNAGGREGATABLE.has(name)) return;   // handled after / dropped
      sums[name] = (sums[name] || 0) + n;
    });
  });

  const out = {};
  Object.entries(sums).forEach(([k, v]) => { out[k] = fmtNum(v); });
  Object.entries(maxes).forEach(([k, v]) => { out[k] = fmtNum(v); });
  Object.entries(pairs).forEach(([k, [a, b]]) => { out[k] = `${fmtNum(a)}-${fmtNum(b)}`; });

  Object.entries(DERIVED).forEach(([name, [nk, dk, kind, dp]]) => {
    if (!names.includes(name)) return;
    const n = sums[nk], d = sums[dk];
    if (n == null || !d) return;
    out[name] = kind === 'pct' ? (n / d * 100).toFixed(dp) : (n / d).toFixed(dp);
  });

  if (names.includes('QBRating')) {
    const r = passerRating(sums.completions || 0, sums.passingAttempts || 0,
                           sums.passingYards || 0, sums.passingTouchdowns || 0, sums.interceptions || 0);
    if (r != null) out.QBRating = r;
  }
  out.gamesPlayed = String(rows.length);
  return out;
}

// =====================================================================================
// Career
// =====================================================================================
// The /stats endpoint already gives per-category career `totals` alongside a season-by-season
// breakdown, both with `names`. Nothing to aggregate by hand.

async function fetchCareer(pid) {
  const d = await jc(`${WEB}/athletes/${pid}/stats`);
  const cats = d.categories || [];
  const isScoring = c => c.name === 'scoring';
  // Two different orders here, for two different reasons:
  //  - merging values: 'scoring' first, so the specific categories overwrite the vaguer keys it
  //    shares with them (its `fieldGoals` vs kicking's `fieldGoalsMade`).
  //  - display: 'scoring' last, so a quarterback's card opens on his passing line instead of on
  //    the 0 FG / 0 XP rows that scoring contributes for everyone who isn't a kicker.
  const mergeOrder = [...cats].sort((a, b) => (isScoring(a) ? -1 : isScoring(b) ? 1 : 0));
  const nameOrder = [...cats.filter(c => !isScoring(c)), ...cats.filter(isScoring)];

  const names = [];
  nameOrder.forEach(c => (c.names || []).forEach((n, i) => {
    if (!names.includes(n)) names.push(n);
    LABEL_HINT[n] = LABEL_HINT[n] || ((c.labels || [])[i] || '').trim();
  }));

  const totals = {};
  const seasons = new Map();     // year -> {year, team, map}
  mergeOrder.forEach(c => {
    const cn = c.names || [];
    if (c.totals) Object.assign(totals, toMap(cn, c.totals));
    (c.statistics || []).forEach(s => {
      const yr = s.season && s.season.year;
      if (!yr) return;
      if (!seasons.has(yr)) seasons.set(yr, { year: yr, team: s.teamSlug || '', map: {} });
      Object.assign(seasons.get(yr).map, toMap(cn, s.stats));
    });
  });
  return { names, totals, seasons: [...seasons.values()].sort((a, b) => b.year - a.year) };
}

// Career vs one opponent has no endpoint of its own — the splits endpoint is per-season only (its
// byOpponent category covers a single year), so this walks the game log of every season the player
// actually has stats for and keeps the games against that club. One request per season, fired in
// parallel and cached, so it's paid once per player.
//
// Stats are keyed by name rather than by column position here: a player's stat columns can differ
// between seasons (a college-to-pro position change, or a category ESPN added later), so indexing
// into each season's array by number would silently mix a rushing total into a receiving one.
async function fetchCareerGames(pid) {
  if (!modalCareer) modalCareer = await fetchCareer(pid);
  const years = modalCareer.seasons.map(s => s.year);
  const logs = (await Promise.all(years.map(y => fetchGameLog(pid, y).catch(() => null)))).filter(Boolean);

  const names = [];
  const games = [];
  logs.forEach(lg => {
    (lg.names || []).forEach(n => { if (!names.includes(n)) names.push(n); });
    (lg.games || []).forEach(g => games.push({ ...g, map: toMap(lg.names, g.stats) }));
  });
  games.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
  return { names, games, seasons: years.length };
}

// Aggregate games whose stats are name-keyed maps, by realigning them to one shared name order.
function aggregateGameMaps(names, games) {
  return aggregate(names, games.map(g => names.map(n => g.map[n])));
}

// =====================================================================================
// Position groups + which stats make the on-air bar
// =====================================================================================
// The bar gets a curated handful, not everything: seven cells is the most that reads at a glance
// from a couch. Anything in the spec that the player has no value for is skipped, and if a spec
// comes up short the remaining cells are filled from whatever else the position returned.

const POS_GROUP = pos => {
  const p = (pos || '').toUpperCase();
  if (p === 'QB') return 'qb';
  if (['RB', 'FB', 'HB'].includes(p)) return 'rb';
  if (['WR', 'TE'].includes(p)) return 'wr';
  if (['PK', 'K'].includes(p)) return 'k';
  if (p === 'P') return 'p';
  if (['OT', 'G', 'C', 'OG', 'OC', 'OL', 'T', 'LS'].includes(p)) return 'ol';
  return 'def';
};

const CELL_SPEC = {
  // CMP and ATT are two cells, not a fused "216/339" — that one value was wide enough to drive the
  // whole bar's type size down, and separate cells are individually selectable.
  qb:  ['completions', 'passingAttempts', 'passingYards', 'passingTouchdowns', 'interceptions', 'completionPct', 'QBRating'],
  rb:  ['rushingAttempts', 'rushingYards', 'yardsPerRushAttempt', 'rushingTouchdowns', 'longRushing', 'receptions', 'receivingYards'],
  wr:  ['receptions', 'receivingTargets', 'receivingYards', 'yardsPerReception', 'receivingTouchdowns', 'longReception'],
  def: ['totalTackles', 'soloTackles', 'sacks', 'stuffs', 'interceptions', 'passesDefended', 'fumblesForced'],
  k:   ['fieldGoalsMade-fieldGoalAttempts', 'fieldGoalPct', 'longFieldGoalMade', 'extraPointsMade-extraPointAttempts', 'totalKickingPoints'],
  p:   ['punts', 'grossAvgPuntYards', 'netAvgPuntYards', 'puntsInside20', 'longPunt'],
  ol:  ['gamesPlayed'],
};

const MAX_PICKS = 8;             // more than this and the bar's type gets too small to read
const hasVal = v => v != null && v !== '' && v !== '-' && v !== '--';

// The starting selection for a player: the position's spec, minus anything they have no value for.
// The producer can then add or drop stats by clicking cells on the card.
function defaultPicks(group, map, names) {
  const picks = (CELL_SPEC[group] || []).filter(k => hasVal(map[k])).slice(0, MAX_PICKS);
  // Spec came up short (an unusual position, or a stat line with holes) — top up from whatever else
  // this player actually has, so the bar is never a lonely two cells.
  if (picks.length < 4) {
    (names || []).forEach(n => {
      if (picks.length >= 6 || picks.includes(n) || UNAGGREGATABLE.has(n) || n === 'gamesPlayed') return;
      if (!hasVal(map[n]) || map[n] === '0') return;
      picks.push(n);
    });
  }
  return picks;
}

// Drag order is remembered per position group (QB/RB/WR/etc.), not per player — so rearranging the
// bar for one quarterback keeps that arrangement the next time any quarterback is opened, the same
// way the Warehouse Games lower third remembers stat order per side.
let statOrder = {};
try { statOrder = JSON.parse(localStorage.getItem('nfl.statorder') || '{}'); } catch { statOrder = {}; }

function saveOrder(group, names) {
  statOrder[group] = names;
  try { localStorage.setItem('nfl.statorder', JSON.stringify(statOrder)); } catch {}
}

// Curated spec order first, then whatever else the position has — this is the baseline a group
// starts from before any drag ever moves a tile.
function defaultEntryOrder(group, entries) {
  const spec = CELL_SPEC[group] || [];
  const byName = new Map(entries.map(e => [e[0], e]));
  const ordered = spec.filter(k => byName.has(k)).map(k => byName.get(k));
  const rest = entries.filter(([name]) => !spec.includes(name));
  return [...ordered, ...rest];
}

// Re-sorts entries against a remembered drag order. Stable, and anything the remembered order has
// never seen (a stat this player has that the last one didn't) just stays where it already was.
function orderedEntries(group, entries) {
  const ord = statOrder[group];
  if (!ord || !ord.length) return entries;
  const at = e => { const i = ord.indexOf(e[0]); return i < 0 ? 1e6 : i; };
  return [...entries].sort((a, b) => at(a) - at(b));
}

// Selection order is bar order, so clicking builds the layout left to right.
function cellsFromPicks(entries, picks, map) {
  return (entries || []).filter(([name]) => picks.includes(name) && hasVal(map[name]))
    .map(([name, label]) => [label, map[name]]);
}

// =====================================================================================
// Player modal
// =====================================================================================

const TF = [
  ['season', 'FULL SEASON'],
  ['pre',    'PRESEASON'],
  ['last3',  'LAST 3'],
  ['last5',  'LAST 5'],
  ['home',   'HOME'],
  ['away',   'AWAY'],
  ['div',    'VS DIVISION'],
  ['opp',    'VS OPPONENT'],
  ['career', 'CAREER TOTAL'],
  ['careerOpp', 'CAREER VS TEAM'],
];
const isOppTf = tf => tf === 'opp' || tf === 'careerOpp';

let modalPid = null, modalRow = null, modalTf = 'season', modalGroup = null;
let modalLog = null, modalCareer = null, modalCareerGames = null, modalPreseason = null;
let modalMap = null, modalNames = null, modalLabel = '', modalSub = '';
let modalOpp = '';
// Which stats are on the bar, in bar order. Seeded from the position defaults each time a new
// player is opened, then whatever the producer has clicked. Kept across timeframe changes for the
// same player — flipping to LAST 3 shouldn't undo a selection you just made.
let modalPicks = [];
let modalEntries = [];           // [[statName, label, value]] for the whole grid

async function openPlayerModal(pid) {
  const row = currentIndex.get(String(pid));
  if (!row) return;
  const samePlayer = modalPid === String(pid);
  modalPid = String(pid); modalRow = row; modalTf = 'season'; modalOpp = '';
  if (!samePlayer) modalPicks = [];      // new player: back to that position's defaults
  modalLog = modalCareer = modalCareerGames = modalPreseason = null;
  $('modalDlNote').textContent = '';
  $('modalHeadshot').src = headshotURL(pid);
  $('modalHeadshot').onerror = function () { this.style.visibility = 'hidden'; };
  $('modalHeadshot').style.visibility = 'visible';
  $('modalName').textContent = row.name;
  $('modalSub').textContent = [row.pos, row.team].filter(Boolean).join(' · ');
  $('modalBackdrop').hidden = false;
  paintTfPills();
  await loadModalStats();
}

function paintTfPills() {
  const box = $('tfPills'); box.innerHTML = '';
  TF.forEach(([key, label]) => {
    const b = el('button', 'tf-pill' + (key === modalTf ? ' on' : ''), label);
    b.type = 'button';
    b.onclick = () => { modalTf = key; paintTfPills(); loadModalStats(); };
    box.appendChild(b);
  });
}

function tfLabel(tf, year) {
  switch (tf) {
    case 'season': return `${year} SEASON`;
    case 'pre':    return `${year} PRESEASON`;
    case 'last3':  return 'LAST 3 GAMES';
    case 'last5':  return 'LAST 5 GAMES';
    case 'home':   return `${year} AT HOME`;
    case 'away':   return `${year} ON THE ROAD`;
    case 'div':    return `${year} VS DIVISION`;
    case 'opp':    return modalOpp ? `${year} VS ${modalOpp}` : `${year} VS OPPONENT`;
    case 'career': return 'CAREER';
    case 'careerOpp': return modalOpp ? `CAREER VS ${modalOpp}` : 'CAREER VS TEAM';
    default:       return String(tf).toUpperCase();
  }
}

// Which games a timeframe covers. Everything except Full Season and Career is a filter here.
function gamesFor(tf, log, row) {
  const g = log.games || [];
  const myDiv = DIV_OF[(row.teamAbbr || '').toUpperCase()];
  switch (tf) {
    case 'last3': return g.slice(0, 3);
    case 'last5': return g.slice(0, 5);
    case 'home':  return g.filter(x => x.home);
    case 'away':  return g.filter(x => !x.home);
    case 'div':   return myDiv ? g.filter(x => {
      const od = DIV_OF[(x.oppAbbr || '').toUpperCase()];
      return od && od.short === myDiv.short;
    }) : [];
    case 'opp':   return modalOpp ? g.filter(x => x.oppAbbr === modalOpp) : [];
    default:      return g;
  }
}

// Opponent picker, listing only clubs the player has actually faced — for the season pill that's
// this year's schedule, for the career pill it's everyone they've ever played.
function paintOppSelect(games) {
  const row = $('oppRow'), sel = $('oppSelect');
  const show = isOppTf(modalTf);
  row.hidden = !show;
  if (!show) return;
  const counts = new Map();
  (games || []).forEach(g => { if (g.oppAbbr) counts.set(g.oppAbbr, (counts.get(g.oppAbbr) || 0) + 1); });
  const opps = [...counts.keys()].sort();
  if (!opps.includes(modalOpp)) modalOpp = opps[0] || '';
  sel.innerHTML = opps.length
    ? opps.map(a => `<option value="${a}"${a === modalOpp ? ' selected' : ''}>${a} (${counts.get(a)} G)</option>`).join('')
    : '<option value="">no games</option>';
}

// Every cell is a toggle: click to put that stat on the bar, click again to take it off. Bar order
// follows the grid's own order (drag a tile to move it — see wireGridDrag), so the badge on a
// selected cell is its position among the *other selected* cells in that same order, not click order.
function statGrid(entries, picks) {
  const pickedInOrder = entries.filter(([name]) => picks.includes(name)).map(([name]) => name);
  const order = new Map(pickedInOrder.map((k, i) => [k, i + 1]));
  return `<div class="stat-grid">` + entries.map(([name, label, v]) => {
    const n = order.get(name);
    return `<div class="cell${n ? ' pick' : ''}" data-stat="${name}" draggable="true" role="button" tabindex="0"` +
      ` title="${n ? 'Click to take off the bar · drag to reorder' : 'Click to add to the bar · drag to reorder'}">` +
      (n ? `<div class="ord">${n}</div>` : '') +
      `<div class="v">${hasVal(v) ? v : '–'}</div><div class="k">${label}</div></div>`;
  }).join('') + `</div>`;
}

// Drag a tile to move it; where the tiles sit is the order they appear on the bar. Listeners live on
// the host (which survives every repaint), guarded so they're only wired once.
let statDragging = false;
function wireGridDrag(host) {
  if (host.dataset.drag) return;
  host.dataset.drag = '1';
  host.addEventListener('dragstart', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    statDragging = true; c.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', c.dataset.stat || '');
  });
  host.addEventListener('dragover', e => {
    const grid = host.querySelector('.stat-grid');
    const held = grid && grid.querySelector('.cell.dragging'); if (!held) return;
    e.preventDefault();
    const over = e.target.closest('.cell');
    if (!over || over === held) return;
    const r = over.getBoundingClientRect();
    grid.insertBefore(held, (e.clientX - r.left) > r.width / 2 ? over.nextSibling : over);
  });
  host.addEventListener('drop', e => e.preventDefault());
  host.addEventListener('dragend', () => {
    const grid = host.querySelector('.stat-grid');
    const held = grid && grid.querySelector('.cell.dragging');
    if (held) held.classList.remove('dragging');
    if (!grid || !modalGroup) return;
    saveOrder(modalGroup, [...grid.querySelectorAll('.cell')].map(c => c.dataset.stat));
    modalEntries = orderedEntries(modalGroup, modalEntries);
    paintStatGrid();
  });
}

// ESPN's season label is the starting year, so a January game belongs to the previous season —
// hence the month check rather than just slicing the year off the date.
function seasonOf(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return String(d.getUTCMonth() < 8 ? d.getUTCFullYear() - 1 : d.getUTCFullYear());
}

function gameLogTable(games, showSeason) {
  if (!games.length) return '';
  const LIMIT = showSeason ? 12 : 6;
  const rows = games.slice(0, LIMIT).map(g =>
    `<tr>` + (showSeason ? `<td>${seasonOf(g.date)}</td>` : '') +
    `<td>${g.week ? 'WK ' + g.week : ''}</td><td>${g.home ? 'vs' : '@'} ${g.oppAbbr}</td>` +
    `<td class="${g.result === 'W' ? 'w' : g.result === 'L' ? 'l' : ''}">${g.result || ''} ${g.score || ''}</td></tr>`).join('');
  return `<table class="gamelog"><thead><tr>${showSeason ? '<th>Season</th>' : ''}` +
         `<th>Week</th><th>Opp</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>` +
         (games.length > LIMIT ? `<div class="pickhint">Showing ${LIMIT} of ${games.length} games</div>` : '');
}

async function loadModalStats() {
  const pid = modalPid, row = modalRow, tf = modalTf;
  const year = $('season').value;
  const group = modalGroup = POS_GROUP(row.pos);
  // Career-vs-team walks every season, so say so rather than sitting on a bare "Loading…"
  $('modalBody').innerHTML = `<div class="modal-empty">Loading ${tfLabel(tf, year).toLowerCase()}` +
    `${tf === 'careerOpp' ? ' — reading every season' : ''}…</div>`;
  $('modalSend').hidden = true;

  try {
    if (tf === 'career') {
      if (!modalCareer) modalCareer = await fetchCareer(pid);
    } else if (tf === 'careerOpp') {
      if (!modalCareerGames) modalCareerGames = await fetchCareerGames(pid);
    } else if (tf === 'pre') {
      if (!modalPreseason) modalPreseason = await fetchPreseasonGames(pid, row.teamId, year);
    } else if (!modalLog) {
      modalLog = await fetchGameLog(pid, year);
    }
  } catch (e) {
    if (modalPid !== pid || modalTf !== tf) return;
    $('modalBody').innerHTML = `<div class="modal-empty">Could not load stats: ${e.message}</div>`;
    return;
  }
  if (modalPid !== pid || modalTf !== tf) return;    // moved on mid-flight

  if (group === 'ol') {
    modalMap = null;
    $('modalBody').innerHTML = `<div class="modal-empty">Offensive line — the NFL doesn't track individual stats for this position.</div>`;
    updateSendBtn();
    return;
  }

  let map, names, sub = '', windowGames = [];
  if (tf === 'career') {
    names = modalCareer.names; map = modalCareer.totals || {};
    const yrs = modalCareer.seasons.length;
    sub = `${map.gamesPlayed || '?'} GP · ${yrs} SEASON${yrs === 1 ? '' : 'S'}`;
  } else if (tf === 'careerOpp') {
    names = modalCareerGames.names;
    paintOppSelect(modalCareerGames.games);
    windowGames = modalOpp ? modalCareerGames.games.filter(g => g.oppAbbr === modalOpp) : [];
    map = aggregateGameMaps(names, windowGames);
    const yrs = new Set(windowGames.map(g => (g.date || '').slice(0, 4))).size;
    sub = `${windowGames.length} G` + (yrs > 1 ? ` · ${yrs} SEASONS` : '');
  } else if (tf === 'pre') {
    names = modalPreseason.names;
    windowGames = modalPreseason.games;
    map = aggregateGameMaps(names, windowGames);
    sub = `${windowGames.length} G`;
  } else {
    names = modalLog.names;
    paintOppSelect(modalLog.games);
    if (tf === 'season') {
      map = modalLog.totals ? toMap(names, modalLog.totals) : aggregate(names, (modalLog.games || []).map(g => g.stats));
      const gp = (modalLog.games || []).filter(g => /regular/i.test(g.seasonType)).length;
      map.gamesPlayed = map.gamesPlayed || String(gp);
      sub = `${map.gamesPlayed} GP`;
      windowGames = modalLog.games || [];
    } else {
      windowGames = gamesFor(tf, modalLog, row);
      map = aggregate(names, windowGames.map(g => g.stats));
      sub = `${windowGames.length} G`;
    }
  }

  modalMap = map; modalNames = names; modalLabel = tfLabel(tf, year); modalSub = sub;

  const noData = !names || !names.length ||
                 (tf !== 'career' && tf !== 'season' && !windowGames.length) ||
                 (tf === 'career' && !Object.keys(map).length);
  if (noData) {
    const why = tf === 'career'
      ? 'No career stats on record for this player.'
      : tf === 'pre'
        ? `No preseason games played yet for ${year}.`
        : !names || !names.length
          ? `No ${year} stats for this player — they may not have played this season.`
          : tf === 'careerOpp'
            ? `Never played ${modalOpp || 'that team'}.`
            : `No games in this filter for ${year}.`;
    $('modalBody').innerHTML = `<div class="modal-empty">${why}</div>`;
    modalMap = null;
    updateSendBtn();
    return;
  }

  // Every stat this position returned, as [name, label, value] — the clickable grid. Ordered by the
  // curated spec first, then re-sorted against whatever this group has been dragged to before.
  const rawEntries = names
    .filter(n => n !== 'gamesPlayed' && !(tf !== 'season' && tf !== 'career' && UNAGGREGATABLE.has(n)))
    .map(n => [n, labelFor(n, LABEL_HINT[n]), map[n]])
    .filter(([, , v]) => v != null && v !== '');
  modalEntries = orderedEntries(group, defaultEntryOrder(group, rawEntries));

  // Seed the selection from the position defaults. Also re-seed if a carried-over selection has
  // nothing left in it — Career exposes a different set of stat names than the game log does, so a
  // selection made on one view can come up empty on the other.
  const live = modalPicks.filter(k => hasVal(map[k]));
  modalPicks = live.length ? live : defaultPicks(group, map, names);

  const gamesHtml = windowGames.length && tf !== 'season'
    ? `<div class="modal-section"><h3>Games in this filter</h3>` +
      `${gameLogTable(windowGames, tf === 'careerOpp')}</div>` : '';
  $('modalBody').innerHTML =
    `<div class="modal-section"><h3>${modalLabel} · ${sub}</h3>` +
    `<div class="modal-hitline" id="barShows"></div>` +
    `<div id="statGridHost"></div>` +
    `<div class="pickhint">Click a stat to add or remove it · drag a tile to move it · up to ${MAX_PICKS}</div>` +
    `</div>` + gamesHtml;

  paintStatGrid();
}

// Repaints just the grid and the "bar shows" line, so toggling a stat doesn't refetch anything.
function paintStatGrid() {
  const host = $('statGridHost');
  if (!host || !modalMap) return;
  host.innerHTML = statGrid(modalEntries, modalPicks);
  wireGridDrag(host);
  const shows = $('barShows');
  if (shows) {
    const cells = cellsFromPicks(modalEntries, modalPicks, modalMap);
    shows.textContent = cells.length
      ? `Bar shows: ${cells.map(([label]) => label).join(' · ')}`
      : 'Nothing selected — click a stat below';
  }
  updateSendBtn();
}

function toggleStat(name) {
  if (!modalMap) return;
  const note = $('modalDlNote');
  const i = modalPicks.indexOf(name);
  if (i >= 0) {
    modalPicks.splice(i, 1);
    note.textContent = '';
  } else {
    if (modalPicks.length >= MAX_PICKS) {
      note.textContent = `${MAX_PICKS} is the limit — take one off first.`;
      return;
    }
    if (!hasVal(modalMap[name])) { note.textContent = 'No value for that stat in this timeframe.'; return; }
    modalPicks.push(name);
    note.textContent = '';
  }
  paintStatGrid();
}

function closeModal() { $('modalBackdrop').hidden = true; }

// =====================================================================================
// The stat line that a Send would put on air
// =====================================================================================

function graphicData() {
  if (!modalMap || !modalRow) return null;
  const cells = cellsFromPicks(modalEntries, modalPicks, modalMap);
  if (!cells.length) return null;
  return { label: modalLabel, hitLine: modalSub, cells };
}

// =====================================================================================
// On air
// =====================================================================================

let onAirPid = null;

function pushOnAir(pid, row, data) {
  if (!row || !data) return;
  onAirPid = String(pid);
  const payload = { pid: String(pid), name: row.name, pos: row.pos, team: row.team, data };
  try { localStorage.setItem(LT_KEY, JSON.stringify({ ...payload, ts: Date.now() })); } catch {}
  if (ltChannel) ltChannel.postMessage(payload);
  publishTopic(payload);
  updateOnAirUI(payload);
}

function clearOnAir() {
  onAirPid = null;
  try { localStorage.removeItem(LT_KEY); } catch {}
  if (ltChannel) ltChannel.postMessage({ clear: true });
  publishTopic(null);
  updateOnAirUI(null);
  if (!$('modalBackdrop').hidden) updateSendBtn();   // flip "◼ Take Down" back to "▶ Send to OBS"
}

function updateOnAirUI(payload) {
  const box = $('onair'); if (!box) return;
  box.hidden = !payload;
  if (payload) $('onairText').innerHTML = `On air: <b>${payload.name}</b> · ${payload.data.label}`;
}

// Is the player this modal has open the one currently on the OBS bar? Not whether the exact
// selection matches — flipping timeframes or picks while live is meant to be safe, that's what
// Update Graphic is for.
const onThisPlayer = () => !!onAirPid && String(onAirPid) === String(modalPid);

function updateSendBtn() {
  const btn = $('modalSend'), updBtn = $('modalUpdate'), dl = $('modalDownload');
  if (!btn) return;
  const has = !!graphicData();
  const live = onThisPlayer();
  btn.hidden = !has && !live;
  btn.textContent = live ? '◼ Take Down' : '▶ Send to OBS';
  btn.classList.toggle('live', live);
  if (updBtn) updBtn.hidden = !(live && has);
  if (dl) dl.hidden = !has;
}

// Nothing reaches OBS until Send is pressed. Browsing players and flipping through timeframes is
// therefore always safe mid-show: the bar holds whatever was last sent, so the producer can go
// look something up on air without it appearing on screen behind them. Once this player is on air,
// the same button becomes Take Down (see updateSendBtn) — Update Graphic is the one that re-pushes.
function pushGraphic(doneMsg) {
  const data = graphicData();
  const note = $('modalDlNote');
  if (!data || !modalRow) {
    if (note) note.textContent = 'Nothing to send for this timeframe.';
    return;
  }
  pushOnAir(modalPid, modalRow, data);
  updateSendBtn();
  if (note) note.textContent = doneMsg;
}

function toggleObs() {
  if (onThisPlayer()) {
    clearOnAir();
    const note = $('modalDlNote'); if (note) note.textContent = 'Removed from OBS ✓';
    return;
  }
  pushGraphic('Sent to OBS ✓');
}

// =====================================================================================
// PNG export — the same lower third as a standalone graphic, no OBS required
// =====================================================================================

const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// Loads an image and proves it won't taint the canvas before committing to it — ESPN's headshot
// CDN sends CORS today, but a graphic without a photo beats a failed export if that ever changes.
function loadSafeImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const t = document.createElement('canvas'); t.width = t.height = 2;
        t.getContext('2d').drawImage(img, 0, 0, 2, 2);
        t.toDataURL();
        resolve(img);
      } catch { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

// Mirrors the on-air .lt-bar layout on a canvas, reading the same brand colors out of :root, so the
// downloaded graphic and the live OBS bar always match.
async function renderLowerThirdCanvas(data, row, pid) {
  await Promise.all([document.fonts.load('400 68px "Bebas Neue"'), document.fonts.load('500 22px "DM Mono"')]);
  const img = await loadSafeImage(headshotURL(pid));

  const W = 1920, H = 200;
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const ltFrom = cssVar('--lt-from'), ltMid = cssVar('--lt-mid'), ltTo = cssVar('--lt-to');
  const accent = cssVar('--accent'), label = cssVar('--label'), white = cssVar('--white') || '#fff';

  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, ltFrom); grad.addColorStop(0.55, ltMid); grad.addColorStop(1, ltTo);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = accent; ctx.fillRect(0, 0, W, 6);

  const pad = 44, r = 76, cx = pad + r, cy = H / 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath();
  if (img) {
    ctx.save(); ctx.clip();
    const size = r * 2, scale = Math.max(size / img.width, size / img.height);
    const iw = img.width * scale, ih = img.height * scale;
    ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
    ctx.restore();
  } else {
    ctx.fillStyle = ltMid; ctx.fill();
  }
  ctx.lineWidth = 4; ctx.strokeStyle = accent; ctx.stroke();

  const nx = cx + r + 24;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '400 68px "Bebas Neue"';
  const name = (row.name || '').toUpperCase();
  const nameW = ctx.measureText(name).width;
  ctx.font = '500 22px "DM Mono"';
  const sub = [row.pos, row.team].filter(Boolean).join('  ·  ').toUpperCase();
  const subW = ctx.measureText(sub).width;

  ctx.fillStyle = white; ctx.font = '400 68px "Bebas Neue"'; ctx.fillText(name, nx, cy - 6);
  ctx.fillStyle = label; ctx.font = '500 22px "DM Mono"'; ctx.fillText(sub, nx, cy + 28);

  const dividerX = nx + Math.max(nameW, subW) + 24;
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(dividerX, 36); ctx.lineTo(dividerX, H - 36); ctx.stroke();

  const statsX0 = dividerX + 24, statsW = (W - pad) - statsX0, cellW = statsW / Math.max(data.cells.length, 1);
  if (data.hitLine) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '500 20px "DM Mono"';
    ctx.fillText(data.hitLine.toUpperCase(), statsX0 + statsW / 2, 46);
  }
  const valueBase = data.hitLine ? 128 : 118, labelBase = valueBase + 34;
  data.cells.forEach(([lbl, value], i) => {
    const x = statsX0 + i * cellW + cellW / 2;
    ctx.textAlign = 'center';
    let vs = data.cells.length > 6 ? 60 : data.cells.length > 4 ? 68 : 76;
    ctx.font = `400 ${vs}px "Bebas Neue"`;
    while (vs > 28 && ctx.measureText(String(value)).width > cellW - 16)
      ctx.font = `400 ${vs -= 2}px "Bebas Neue"`;
    ctx.fillStyle = white; ctx.fillText(String(value), x, valueBase);
    ctx.fillStyle = label; ctx.font = '500 17px "DM Mono"';
    ctx.fillText(String(lbl).toUpperCase(), x, labelBase);
  });

  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.font = '500 12px "DM Mono"';
  ctx.fillText(WORDMARK, W - 24, H - 14);

  return { canvas, hadPhoto: !!img };
}

async function downloadGraphic() {
  const data = graphicData();
  const note = $('modalDlNote'), btn = $('modalDownload');
  if (!data || !modalRow) { if (note) note.textContent = 'Nothing to export for this timeframe.'; return; }
  btn.disabled = true;
  if (note) note.textContent = 'Building PNG…';
  try {
    const { canvas, hadPhoto } = await renderLowerThirdCanvas(data, modalRow, modalPid);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('Canvas export failed');
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${modalRow.name.replace(/[^\w\d]+/g, '-')}-${data.label.replace(/[^\w\d]+/g, '-')}-lower-third.png`;
    a.click(); URL.revokeObjectURL(a.href);
    if (note) note.textContent = hadPhoto ? 'Downloaded ✓' : 'Downloaded ✓ (headshot host blocked embedding — saved without it)';
  } catch (e) {
    if (note) note.textContent = 'Could not build the graphic: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// matches the CSS transition on .lt-bar, so a player-to-player swap fades the old one fully out
// before the new content is painted and faded in — never an instant content pop
const LT_FADE_MS = 350;
let ltFadeTimer = null, ltVisible = false;

function paintOnAirBar(payload) {
  const { name, pos, team, data } = payload;
  const hs = $('ltHeadshot');
  hs.src = headshotURL(payload.pid);
  hs.style.visibility = 'visible';
  hs.onerror = function () { this.style.visibility = 'hidden'; };
  $('ltName').textContent = (name || '').toUpperCase();
  $('ltSub').textContent = [pos, team].filter(Boolean).join('  ·  ').toUpperCase();
  const hitEl = $('ltHitline');
  const splitText = data.label ? data.label.toUpperCase() : '';
  const subText = data.hitLine ? data.hitLine.toUpperCase() : '';
  hitEl.innerHTML = splitText ? `<span class="split">${splitText}</span>${subText ? '  ·  ' + subText : ''}` : '';
  hitEl.style.display = splitText ? '' : 'none';
  $('ltCells').innerHTML = data.cells.map(([label, value]) =>
    `<div class="lt-cell"><div class="v">${value}</div><div class="k">${label}</div></div>`).join('');
  sizeCells(data.cells.length);
  $('ltBar').classList.add('lt-visible');
  ltVisible = true;
}

function renderOnAirBar(payload) {
  const bar = $('ltBar');
  if (!bar) return;
  clearTimeout(ltFadeTimer);
  if (!payload) {
    bar.classList.remove('lt-visible');   // fades out; content stays underneath
    ltVisible = false;
    return;
  }
  if (ltVisible) {
    bar.classList.remove('lt-visible');
    ltFadeTimer = setTimeout(() => paintOnAirBar(payload), LT_FADE_MS);
  } else {
    paintOnAirBar(payload);
  }
}

// Shrinks each stat cell (width + font) to whatever fits in one row — mirrors the shrink-to-fit
// the canvas export does, so the live bar never wraps no matter how many cells a timeframe adds.
function sizeCells(n) {
  const wrap = $('ltCells');
  if (!wrap || !n) return;
  const values = [...wrap.querySelectorAll('.lt-cell .v')];
  const keys = [...wrap.querySelectorAll('.lt-cell .k')];
  if (!values.length) return;

  // One size for every value on the bar, stepped down together until the whole row fits. Uniform
  // beats per-cell: shrinking only the wide value left it visibly smaller than the number next to
  // it, which is what read as squished. Cells are auto-width (see CSS), so a long value takes more
  // horizontal room rather than shrinking to fit a fixed column.
  let fs = 76, ks = 17;
  const apply = () => {
    values.forEach(v => { v.style.fontSize = fs + 'px'; });
    keys.forEach(k => { k.style.fontSize = ks + 'px'; });
  };
  apply();
  // nowrap flex row: content wider than the track shows up as scrollWidth > clientWidth
  let guard = 0;
  while (fs > 30 && wrap.scrollWidth > wrap.clientWidth && guard++ < 40) {
    fs -= 2;
    if (ks > 11 && fs % 8 === 0) ks -= 1;
    apply();
  }
}

// ---- display side ----------------------------------------------------------------------
// One RTDB listener. The SDK owns the socket, reconnects on its own, and replays the stored
// value on connect — so an OBS Browser Source refreshed mid-show comes straight back up with
// whatever is currently on air, and a wifi blip holds the last frame instead of blanking.
function initDisplay() {
  if (TOPIC && _db) {
    onAirRef().on('value', snap => {
      const s = snap.val();
      renderOnAirBar(s && !s.clear && s.pid ? s : null);
    }, () => { /* permission/network error — hold the last frame */ });
    return;
  }
  // No room given: same-browser fallback for a second-window / window-capture setup.
  try {
    const cached = JSON.parse(localStorage.getItem(LT_KEY) || 'null');
    if (cached) renderOnAirBar(cached);
  } catch {}
  if (ltChannel) ltChannel.onmessage = e => renderOnAirBar(e.data && e.data.clear ? null : e.data);
  window.addEventListener('storage', e => {
    if (e.key !== LT_KEY) return;
    try { renderOnAirBar(e.newValue ? JSON.parse(e.newValue) : null); } catch {}
  });
}

// =====================================================================================
// Wiring
// =====================================================================================

const guard = fn => (...a) => Promise.resolve(fn(...a)).catch(e => say(e.message, true));

let searchDebounce = null;
$('find').oninput = () => {
  clearTimeout(searchDebounce);
  const q = $('find').value;
  searchDebounce = setTimeout(() => guard(async () => renderSearchResults(q))(), 150);
};

$('division').onchange = () => {
  const dv = $('division').value;
  populateTeamSelect(dv);
  $('team').value = '';
  $('find').value = '';
  renderDirectory(dv);
};
$('goHome').onclick = () => {
  $('division').value = '';
  populateTeamSelect('');
  $('team').value = '';
  $('find').value = '';
  currentTeamId = null;
  renderDirectory();
};
$('goGiants').onclick = () => {
  $('find').value = '';
  $('team').value = String(HOME_TEAM_ID);
  guard(loadRoster)(HOME_TEAM_ID);
};
$('team').onchange = () => {
  const id = $('team').value;
  $('find').value = '';
  if (id) guard(loadRoster)(id);
  else renderDirectory($('division').value);
};
$('season').onchange = guard(async () => {
  jCache.clear();                                  // season changed: gamelogs must refetch
  modalLog = modalCareer = modalCareerGames = modalPreseason = null;
  if (currentView === 'roster' && currentTeamId) guard(loadRoster)(currentTeamId);
  else if (currentView === 'search') renderSearchResults($('find').value);
  else renderDirectory($('division').value);
});

$('out').onclick = e => {
  const th = e.target.closest('thead th[data-key]');
  if (th) {
    const { key, tbl } = th.dataset;
    const same = sortState.table === tbl && sortState.key === key;
    sortState = { table: tbl, key, dir: same ? -sortState.dir : 1 };
    if (tbl === 'roster') paintRoster(); else paintSearch();
    return;
  }
  const tr = e.target.closest('tbody tr');
  if (!tr || tr.classList.contains('group') || !tr.dataset.pid) return;
  openPlayerModal(tr.dataset.pid);
};
$('oppSelect').onchange = () => { modalOpp = $('oppSelect').value; loadModalStats(); };
// stat cells are toggles — click (or Enter/Space when tabbed to) puts a stat on the bar or takes it off
$('modalBody').onclick = e => {
  if (statDragging) { statDragging = false; return; }   // a drag ends on a tile; don't toggle it too
  const cell = e.target.closest('.stat-grid .cell[data-stat]');
  if (cell) toggleStat(cell.dataset.stat);
};
$('modalBody').onkeydown = e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const cell = e.target.closest('.stat-grid .cell[data-stat]');
  if (cell) { e.preventDefault(); toggleStat(cell.dataset.stat); }
};
$('modalClose').onclick = closeModal;
$('modalSend').onclick = toggleObs;
$('modalUpdate').onclick = () => pushGraphic('Updated ✓');
$('modalDownload').onclick = downloadGraphic;
$('modalBackdrop').onclick = e => { if (e.target.id === 'modalBackdrop') closeModal(); };
document.onkeydown = e => { if (e.key === 'Escape' && !$('modalBackdrop').hidden) closeModal(); };
$('openDisplay').onclick = () => {
  const url = new URL(location.href);
  url.searchParams.set('display', '1');
  if (TOPIC) url.searchParams.set('topic', TOPIC);
  window.open(url.href, '_blank');
};

// The display URL has to be openable from the OBS machine, which rules out file:// — that path
// only exists on this laptop. Say so up front rather than letting someone paste a dead link.
const servedFromHost = /^https?:$/.test(location.protocol);
function displayURL() {
  return `${location.href.split(/[?#]/)[0]}?display=1&topic=${encodeURIComponent(TOPIC)}`;
}

function connectTopic() {
  const t = $('topicInput').value.trim();
  if (!t) { $('connHint').textContent = 'Enter a room name first.'; $('connHint').className = 'hint warn'; return; }
  TOPIC = t;
  try { localStorage.setItem(TOPIC_KEY, TOPIC); } catch {}
  setConn(true);
  // Republish whatever is already on air, so connecting mid-show brings the display straight up
  // instead of leaving it blank until the next click.
  let current = null;
  try { current = JSON.parse(localStorage.getItem(LT_KEY) || 'null'); } catch {}
  if (current && current.pid) publishTopic(current); else publishTopic(null);
  updateConnHint();
}

function updateConnHint() {
  const hint = $('connHint');
  if (!TOPIC) {
    hint.textContent = 'Pick any room name — both computers connect to the same one.';
    hint.className = 'hint'; return;
  }
  if (!servedFromHost) {
    hint.textContent = 'Opened from a file — the OBS computer can\'t load this URL. Serve it from GitHub Pages first.';
    hint.className = 'hint warn'; return;
  }
  hint.textContent = 'Copy the display URL into the Browser Source on the OBS computer · 1920×1080';
  hint.className = 'hint';
}

$('connectBtn').onclick = connectTopic;
$('topicInput').onkeydown = e => { if (e.key === 'Enter') connectTopic(); };
$('copyDisplayBtn').onclick = () => {
  const btn = $('copyDisplayBtn'), url = displayURL();
  copyText(url)
    .then(() => { btn.textContent = 'Copied ✓'; })
    .catch(() => { prompt('Copy this URL:', url); })
    .finally(() => setTimeout(() => { btn.textContent = 'Copy Display URL'; }, 1600));
};
$('obsUrlCopy').onclick = () => {
  const btn = $('obsUrlCopy');
  copyText($('obsUrlText').textContent)
    .then(() => { btn.textContent = 'Copied ✓'; })
    .catch(() => { btn.textContent = 'Select it'; })
    .finally(() => setTimeout(() => { btn.textContent = 'Copy'; }, 1600));
};
$('onairClear').onclick = clearOnAir;

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = el('textarea'); ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? resolve() : reject(new Error('copy blocked')); }
    catch (e) { reject(e); }
    finally { ta.remove(); }
  });
}

// The NFL season straddles the new year: ESPN's "season 2025" runs Sept 2025 → Feb 2026. So
// before September, the newest season with any games in it is last calendar year's.
function currentSeason() {
  const d = new Date();
  return d.getMonth() < 8 ? d.getFullYear() - 1 : d.getFullYear();
}

if (isDisplayMode) {
  initDisplay();
} else {
  const cs = currentSeason();
  // Regular-season data for cs+1 doesn't exist yet during Jan–Aug, but its preseason already has —
  // e.g. the moment mid-August camp games start, that's already "season cs+1" on ESPN's own numbering,
  // even though the last completed regular season (cs) stays the default view.
  const years = Array.from({ length: cs - 1999 }, (_, i) => cs - i);
  years.splice(1, 0, cs + 1);
  $('season').innerHTML = years.map(y => `<option>${y}</option>`).join('');

  // Reconnect to last show's room automatically; first run gets a suggested one so the only step
  // is clicking Connect. The random tail matters — the room name is the whole address, so a
  // guessable one is someone else's write access to your lower third.
  let saved = '';
  try { saved = localStorage.getItem(TOPIC_KEY) || ''; } catch {}
  $('topicInput').value = saved || `tg-snapshot-${Math.random().toString(36).slice(2, 8)}`;
  if (saved) { TOPIC = saved; setConn(true); }
  else setConn(false);
  updateConnHint();

  guard(async () => {
    buildTeams();               // static table — no request, so the directory is ready immediately
    say('');
    // Open on the Giants — it's their show. The rest of the league is a click away.
    $('team').value = String(HOME_TEAM_ID);
    const nyg = divisions.find(dv => dv.short === 'NFC East');
    if (nyg) $('division').value = 'NFC East';
    await loadRoster(HOME_TEAM_ID);
    buildPlayerIndex();          // fills the global search index in the background
  })();
}
</script>
